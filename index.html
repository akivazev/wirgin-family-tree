<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wirgin Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDEC; --surface:#F7F9F8; --ink:#1E2A33; --muted:#5D6B72; --line:#8A9BA3;
  --accent:#2F4F6F; --probable:#A87A2A; --memorial:#4A3B52; --card:#FFFFFF; --cardline:#C5CFD2;
  --serif:"EB Garamond", Garamond, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161C20; --surface:#1D252A; --ink:#E3E8EA; --muted:#9AA8AE; --line:#5E6F77;
    --accent:#8FB3D9; --probable:#D6A956; --memorial:#B9A3C7; --card:#232D33; --cardline:#3A474E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161C20; --surface:#1D252A; --ink:#E3E8EA; --muted:#9AA8AE; --line:#5E6F77;
  --accent:#8FB3D9; --probable:#D6A956; --memorial:#B9A3C7; --card:#232D33; --cardline:#3A474E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.5rem;padding:1rem max(16px,1.25rem) .75rem;border-bottom:1px solid var(--cardline)}
h1{font-family:var(--serif);font-weight:500;font-size:1.9rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:0;max-width:60ch}
.tools{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
input[type=search]{font:inherit;font-size:.9rem;padding:.4rem .6rem;border:1px solid var(--cardline);border-radius:4px;background:var(--surface);color:var(--ink);width:13rem;max-width:60vw}
button{font:inherit;font-size:.85rem;padding:.35rem .7rem;border:1px solid var(--cardline);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#canvas{flex:1;overflow:auto;position:relative;min-width:0}
#panel{width:23rem;max-width:100%;border-left:1px solid var(--cardline);background:var(--surface);overflow:auto;padding:1.25rem 1.4rem 2rem}
#panel h2{font-family:var(--serif);font-weight:500;font-size:1.65rem;line-height:1.15;margin:0 0 .2rem}
#panel .aka{color:var(--muted);font-size:.85rem;margin:0 0 .8rem}
#panel h3{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:1.2rem 0 .35rem}
.ev{margin:0 0 .65rem}
.ev .what{font-weight:500}
.ev .src,.note{color:var(--muted);font-size:.83rem}
.note{margin:.3rem 0}
.flag{display:inline-block;font-size:.78rem;padding:.05rem .45rem;border-radius:3px;margin:0 .3rem .4rem 0;border:1px solid}
.flag.prob{color:var(--probable);border-color:var(--probable)}
.flag.mem{color:var(--memorial);border-color:var(--memorial)}
.rel a{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rel{margin:.15rem 0}
.empty{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.15rem}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.8rem;color:var(--muted);padding:.5rem max(16px,1.25rem);border-top:1px solid var(--cardline)}
.legend svg{vertical-align:middle;margin-right:.35rem}
svg text{font-family:var(--serif)}
.person{cursor:pointer}
.person rect.box{fill:var(--card);stroke:var(--cardline);stroke-width:1}
.person:hover rect.box{stroke:var(--accent)}
.person.sel rect.box{stroke:var(--accent);stroke-width:2.5}
.person .nm{fill:var(--ink);font-size:16px;font-weight:500}
.person .yr{fill:var(--muted);font-size:13px;font-family:var(--sans)}
.person .mem{fill:var(--memorial)}
.person:focus{outline:none}
.person:focus-visible rect.box{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 2}
.lk{stroke:var(--line);stroke-width:1.4;fill:none}
.lk.prob{stroke:var(--probable);stroke-dasharray:5 4}
.mar{stroke:var(--line);stroke-width:1.4}
@media (max-width:760px){
  main{flex-direction:column}
  #panel{width:auto;border-left:0;border-top:1px solid var(--cardline);max-height:45%}
  h1{font-size:1.5rem}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){ #canvas{scroll-behavior:smooth} }
</style>

<script>
const DEFAULT_MEMORIAL='Murdered in the Shoah';
function gedParse(text){
  const root={children:[]}, stack=[root];
  for(const line of text.split(/\r?\n/)){
    const m=line.replace(/^﻿/,'').match(/^\s*(\d+)\s+(@[^@]+@\s+)?(\S+)\s?(.*)$/); if(!m) continue;
    const lvl=+m[1], node={xref:m[2]?m[2].trim():null,tag:m[3],value:m[4]||'',children:[]};
    if(node.tag==='CONT'||node.tag==='CONC'){ const p=stack[lvl]; if(p){ p.value+=(node.tag==='CONT'?'\n':'')+node.value; } continue; }
    stack.length=lvl+1; (stack[lvl]||root).children.push(node); stack[lvl+1]=node;
  }
  return root.children;
}
const NO_LABEL={IMMI:'emigration',EMIG:'emigration',MARR:'marriage',DEAT:'death',BIRT:'birth',NATU:'naturalization'};
function autoBus(fams,POS,cx){
  const byRow={}, shift={};
  Object.values(fams).forEach(f=>{
    const ps=[f.husb,f.wife].filter(id=>POS[id]); const ch=f.chil.filter(id=>POS[id]);
    if(!ps.length||!ch.length) return;
    const xs=ch.map(cx).concat(ps.reduce((s,id)=>s+cx(id),0)/ps.length);
    (byRow[POS[ps[0]][1]]=byRow[POS[ps[0]][1]]||[]).push({id:f.id,lo:Math.min(...xs),hi:Math.max(...xs)});
  });
  Object.values(byRow).forEach(list=>{
    list.sort((a,b)=>a.lo-b.lo); const lanes=[];
    list.forEach(f=>{
      let l=lanes.findIndex(end=>end<f.lo-8); if(l<0){l=lanes.length;lanes.push(0);} lanes[l]=f.hi;
      shift[f.id]=l===0?0:(l%2?-1:1)*Math.ceil(l/2)*14;
    });
  });
  return shift;
}
function run(raw, cfg, layout){
const recs=gedParse(raw), byId={};
recs.forEach(r=>{ if(r.xref) byId[r.xref]=r; });
const kid=(n,t)=>n.children.find(c=>c.tag===t);
const kids=(n,t)=>n.children.filter(c=>c.tag===t);
const val=(n,t)=>{const k=kid(n,t);return k?k.value:'';};
const people={}, fams={};
recs.forEach(r=>{
  if(r.tag==='INDI'){
    const names=kids(r,'NAME').map(n=>n.value.replace(/\//g,'').replace(/\s+/g,' ').trim()).filter(Boolean);
    people[r.xref]={id:r.xref,rec:r,names,famc:kids(r,'FAMC').map(k=>k.value),fams:kids(r,'FAMS').map(k=>k.value)};
  } else if(r.tag==='FAM'){
    fams[r.xref]={id:r.xref,rec:r,husb:val(r,'HUSB'),wife:val(r,'WIFE'),chil:kids(r,'CHIL').map(k=>k.value)};
  }
});
Object.values(fams).forEach(f=>{
  [f.husb,f.wife].forEach(p=>{ if(people[p]&&!people[p].fams.includes(f.id)) people[p].fams.push(f.id); });
  f.chil.forEach(c=>{ if(people[c]&&!people[c].famc.includes(f.id)) people[c].famc.push(f.id); });
});
const SNOTES={}; recs.forEach(r=>{if(r.tag==='SNOTE')SNOTES[r.xref]=r.value;});
const PROBABLE_CHILD={}; Object.values(people).forEach(p=>kids(p.rec,'FAMC').forEach(f=>{
  if(val(f,'_CONF')==='PROBABLE'){ const t=kids(f,'NOTE').map(n=>n.value).join(' ')||'Probable, not proven.';
    PROBABLE_CHILD[p.id]=PROBABLE_CHILD[p.id]?PROBABLE_CHILD[p.id]+' '+t:t; }}));
const POS=Object.fromEntries(Object.entries(layout.pos).filter(([id,p])=>people[id]&&Array.isArray(p)&&p.length===2));
const MEMORIAL=(cfg.memorial&&String(cfg.memorial))||DEFAULT_MEMORIAL;
document.getElementById('memlabel').textContent=MEMORIAL;
function yearOf(ev){
  if(!ev) return '';
  const d=val(ev,'DATE'); if(!d) return '';
  let m;
  if(m=d.match(/^BET\s+(\d{4})\s+AND\s+(\d{4})/)) return m[1]===m[2]?m[1]:m[1]+'–'+m[2].slice(2);
  const y=(d.match(/(\d{4})/)||[])[1]; if(!y) return '';
  return (/^(ABT|EST|CAL)/.test(d)?'c. ':'')+y;
}
function lifespan(p){
  const b=yearOf(kid(p.rec,'BIRT')), d=yearOf(kid(p.rec,'DEAT'));
  if(!b&&!d) return '';
  return (b||'?')+' – '+(d||'');
}
function isMemorial(p){

}
document.getElementById('memlegend').hidden=!Object.values(people).some(isMemorial);
function shortName(p){

const UNIT=180, CW=156, CH=62, ROWH=150, PAD=30;
let zoom=1;
const NS='http://www.w3.org/2000/svg';

const minRow=Math.min(...P.map(p=>p[1])), minCol=Math.min(...P.map(p=>p[0]));

const W=PAD*2+maxCol*UNIT+CW, H=PAD*2+maxRow*ROWH+CH;

const gl=el('g',{}), gp=el('g',{});
svg.append(gl,gp);
Object.values(fams).forEach(f=>{
  const ps=[f.husb,f.wife].filter(id=>POS[id]);
  if(ps.length===2&&POS[ps[0]][1]===POS[ps[1]][1]){
    const [a,b]=ps.sort((x,y)=>POS[x][0]-POS[y][0]);
    const y=ty(a)+CH/2;
    gl.append(el('line',{x1:cx(a)+CW/2,y1:y,x2:cx(b)-CW/2,y2:y,class:'mar'}));
  }
  const ch=f.chil.filter(id=>POS[id]); if(!ch.length||!ps.length) return;
  const mx=ps.reduce((s,id)=>s+cx(id),0)/ps.length, py=ty(ps[0])+CH/2;
  const busY=ty(ps[0])+CH+(ROWH-CH)/2+(BUS_SHIFT[f.id]||0);
  const allProb=ch.every(id=>PROBABLE_CHILD[id]);
  gl.append(el('line',{x1:mx,y1:ps.length===2?py:ty(ps[0])+CH,x2:mx,y2:busY,class:'lk'+(allProb?' prob':'')}));
  const xs=ch.map(cx).concat(mx);
  gl.append(el('line',{x1:Math.min(...xs),y1:busY,x2:Math.max(...xs),y2:busY,class:'lk'+(allProb?' prob':'')}));
  ch.forEach(id=>gl.append(el('line',{x1:cx(id),y1:busY,x2:cx(id),y2:ty(id),class:'lk'+(PROBABLE_CHILD[id]?' prob':'')})));
});
const nodes={};
Object.values(people).forEach(p=>{
  if(!POS[p.id]) return;
  const x=cx(p.id)-CW/2, y=ty(p.id);
  const g=el('g',{class:'person',transform:`translate(${x},${y})`,tabindex:0,role:'button','aria-label':(p.names[0]||'Unknown')+' '+lifespan(p)});
  g.append(el('rect',{class:'box',width:CW,height:CH,rx:3}));
  if(isMemorial(p)) g.append(el('rect',{class:'mem',width:5,height:CH,rx:1}));
  const t1=el('text',{class:'nm',x:14,y:26}); t1.textContent=shortName(p);
  const t2=el('text',{class:'yr',x:14,y:47}); t2.textContent=lifespan(p);
  g.append(t1,t2);
  g.addEventListener('click',()=>select(p.id));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.id);}});
  gp.append(g); nodes[p.id]=g;
});

canvas.append(svg);
function applyZoom(){svg.setAttribute('width',W*zoom);svg.setAttribute('height',H*zoom);}
applyZoom();
document.getElementById('zi').onclick=()=>{zoom=Math.min(2,zoom*1.2);applyZoom();};
document.getElementById('zo').onclick=()=>{zoom=Math.max(.3,zoom/1.2);applyZoom();};
const panel=document.getElementById('panel');
const NOLAB={IMMI:'Did not emigrate'};
const LABEL={BIRT:'Born',DEAT:'Died',BURI:'Buried',IMMI:'Arrived',EMIG:'Emigrated',NATU:'Naturalized',RESI:'Lived',OCCU:'Occupation',MARR:'Married',PROP:'Property',EDUC:'Education',EVEN:'Event',NATI:'Nationality',TITL:'Title'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDate(d){
  return d.replace(/^ABT /,'about ').replace(/^BEF /,'before ').replace(/^BET (.+?) AND (.+)$/,'between $1 and $2').replace(/^FROM (.+?) TO (.+)$/,'$1 to $2').replace(/^FROM (\S+)$/,'from $1')
    .replace(/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\b/g,m=>m[0]+m.slice(1).toLowerCase());
}
function srcText(s){
  const r=byId[s.value]; if(!r) return s.value&&!/^@/.test(s.value)?s.value:'';
  let t=val(r,'TITL'); const pg=val(s,'PAGE'); if(pg) t+=', '+pg; return t;
}
function eventHTML(ev){
  const parts=[];
  const ty=val(ev,'TYPE');
  if(ev.tag==='EVEN'&&ev.value){ parts.push(esc(ev.value)); }
  else if(ev.value&&ev.value!=='Y') parts.push(esc(ev.value));
  const dn=kid(ev,'DATE'); if(dn&&dn.value){ let s=esc(fmtDate(dn.value)); const ph=val(dn,'PHRASE'); if(ph) s+=` <span class="src">(${esc(ph)})</span>`; parts.push(s);}
  const pl=val(ev,'PLAC')||val(ev,'ADDR'); if(pl) parts.push(esc(pl));
  const lab=ev.tag==='EVEN'&&ty?ty:LABEL[ev.tag];
  let h=`<div class="ev"><span class="what">${esc(lab)}</span> ${parts.join(', ')}`;
  kids(ev,'NOTE').forEach(n=>h+=`<div class="note">${esc(n.value)}</div>`);
  kids(ev,'SOUR').forEach(s=>h+=`<div class="src">Source: ${esc(srcText(s))}</div>`);

}
const link=id=>`<a data-id="${esc(id)}">${esc(people[id].names[0]||'Unknown')}</a>`;
function select(id){
  const p=people[id]; if(!p||!nodes[id]) return;
  Object.values(nodes).forEach(n=>n.classList.remove('sel'));
  nodes[id].classList.add('sel');
  let h=`<h2>${esc(p.names[0]||'Unknown')}</h2>`;
  const tr=kids(p.rec,'NAME').flatMap(n=>kids(n,'TRAN').map(x=>({v:x.value,l:val(x,'LANG')})));
  const aka=p.names.slice(1).map(esc).concat(tr.map(t=>/^(he|yi|ar)/.test(t.l)?`<span dir="rtl" lang="${esc(t.l)}">${esc(t.v)}</span>`:esc(t.v)));
  if(aka.length) h+=`<p class="aka">Also recorded as ${aka.join('; ')}</p>`;
  if(PROBABLE_CHILD[id]) h+=`<span class="flag prob">Probable parentage</span>`;
  if(isMemorial(p)) h+=`<span class="flag mem">${esc(MEMORIAL)}</span>`;
  const evs=p.rec.children.filter(c=>LABEL[c.tag]);
  p.fams.forEach(fid=>{const f=fams[fid]; const m=f&&kid(f.rec,'MARR'); if(m) evs.push(m);});
  if(evs.length){h+='<h3>Records</h3>';evs.forEach(e=>h+=eventHTML(e));}
  if(PROBABLE_CHILD[id]) h+=`<p class="note">${esc(PROBABLE_CHILD[id])}</p>`;
  const ex=kids(p.rec,'EXID'); if(ex.length){h+='<h3>Online records</h3>';ex.forEach(e=>{const ty=val(e,'TYPE');
    h+= /^https:/.test(ty)?`<p class="rel"><a href="${esc(ty+e.value)}" target="_blank" rel="noopener">${/yadvashem/.test(ty)?'Yad Vashem':/geni/.test(ty)?'Geni':'Record'} ${esc(e.value)}</a></p>`:`<p class="rel">${esc(e.value)}</p>`;});}
  const notes=kids(p.rec,'NOTE'); if(notes.length){h+='<h3>Notes</h3>';notes.forEach(n=>h+=`<p class="note">${esc(n.value)}</p>`);}
  h+='<h3>Family</h3>';
  p.famc.forEach(fid=>{const f=fams[fid]; if(!f) return; const ps=[f.husb,f.wife].filter(x=>people[x]);
    if(ps.length) h+=`<p class="rel">Parents: ${ps.map(link).join(' and ')}</p>`;
    const sib=f.chil.filter(c=>c!==id&&people[c]); if(sib.length) h+=`<p class="rel">Siblings: ${sib.map(link).join(', ')}</p>`;});
  p.fams.forEach(fid=>{const f=fams[fid]; if(!f) return; const sp=[f.husb,f.wife].find(x=>x&&x!==id&&people[x]);
    if(sp) h+=`<p class="rel">Spouse: ${link(sp)}</p>`;
    else { const v=[kid(f.rec,'HUSB'),kid(f.rec,'WIFE')].find(n=>n&&n.value==='@VOID@'); if(v) h+=`<p class="rel">Spouse: ${esc(val(v,'PHRASE')||'unknown')}</p>`; }
    const ch=f.chil.filter(c=>people[c]); if(ch.length) h+=`<p class="rel">Children: ${ch.map(link).join(', ')}</p>`;
    kids(f.rec,'NOTE').forEach(n=>h+=`<p class="note">${esc(n.value)}</p>`);});
  panel.innerHTML=h; panel.scrollTop=0;
  panel.querySelectorAll('a[data-id]').forEach(a=>{a.tabIndex=0;a.onclick=()=>select(a.dataset.id);a.onkeydown=e=>{if(e.key==='Enter')select(a.dataset.id);};});
  const r=nodes[id].getBoundingClientRect(), c=canvas.getBoundingClientRect();
  if(r.left<c.left||r.right>c.right||r.top<c.top||r.bottom>c.bottom)
    canvas.scrollBy({left:r.left-c.left-c.width/2+r.width/2,top:r.top-c.top-c.height/2+r.height/2});
}
const dlist=document.getElementById('names'), index=[];
Object.values(people).forEach(p=>{ if(!POS[p.id]) return; p.names.forEach(n=>{index.push([n.toLowerCase(),p.id]);});
  const o=document.createElement('option'); o.value=p.names[0]||''; dlist.append(o);});
document.getElementById('q').addEventListener('change',e=>{
  const q=e.target.value.trim().toLowerCase(); if(!q) return;
  const hit=index.find(([n])=>n===q)||index.find(([n])=>n.includes(q));
  if(hit) select(hit[1]);
});
requestAnimationFrame(()=>{
  const f=(cfg.focus&&POS[cfg.focus])?cfg.focus:null;
  if(f){ canvas.scrollLeft=Math.max(0,cx(f)*zoom-canvas.clientWidth/3); canvas.scrollTop=Math.max(0,ty(f)*zoom-canvas.clientHeight/3); }
});
window._zoom=z=>{zoom=z;applyZoom();};
}
(function(){
  const D=JSON.parse(document.getElementById('treedata').textContent);
  document.getElementById('title').textContent=D.cfg.title;
  document.getElementById('subtitle').textContent=D.cfg.subtitle;
  document.getElementById('snapnote').textContent=D.note||'';
  try{ run(D.cfg.gedcom, D.cfg, D.layout); }
  catch(e){ document.getElementById('panel').innerHTML='<p class="empty">The tree could not be drawn.</p>'; }
})();
</script>
</body></html>
